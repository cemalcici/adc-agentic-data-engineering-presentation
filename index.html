    <script>
      // The shared controller's prev() is not step-aware: it calls enterSlide on
      // the previous slide, which re-enters that slide at its FIRST step. So one
      // Back press from step 4 of slide 14 lands on step 1 of slide 13, and the
      // presenter has to rebuild everything they just walked through.
      //
      // resumeSlide(slideIndex, stepIndex) is the controller's own primitive for
      // landing on an exact step, so prev() is rebuilt on top of it: step back
      // inside the slide, and when leaving one, land on the previous slide fully
      // built rather than blank. Everything else is left to the component.
      //
      // The patch goes on the prototype, not the instance: the component rebuilds
      // its controller after the composition posts its timeline, so an instance
      // patch is silently discarded a moment later.
      (function () {
        var show = document.querySelector("hyperframes-slideshow");
        if (!show) return;

        function stepAwarePrev() {
          var slide = this.currentSlide;

          if (slide && slide.fragments && this.frame.fragmentIndex > 0) {
            this.resumeSlide(this.frame.slideIndex, this.frame.fragmentIndex - 1);
            return;
          }

          if (this.frame.slideIndex > 0) {
            var slides = this.slidesOf(this.frame.sequenceId);
            var target = slides[this.frame.slideIndex - 1];
            var lastStep =
              target && target.fragments && target.fragments.length
                ? target.fragments.length - 1
                : -1;
            if (typeof this.stopSlideMedia === "function") this.stopSlideMedia();
            this.resumeSlide(this.frame.slideIndex - 1, lastStep);
            return;
          }

          if (this.stack && this.stack.length > 1) this.back();
        }

        function patch(controller) {
          if (!controller || typeof controller.resumeSlide !== "function") return false;
          var proto = Object.getPrototypeOf(controller);
          if (!proto || proto.__stepAwarePrev) return true;
          proto.prev = stepAwarePrev;
          proto.__stepAwarePrev = true;
          return true;
        }

        if (patch(show.controller)) return;
        var tries = 0;
        var timer = setInterval(function () {
          if (patch(show.controller) || ++tries > 80) clearInterval(timer);
        }, 100);
      })();
    </script>
