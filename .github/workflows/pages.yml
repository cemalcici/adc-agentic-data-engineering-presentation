# Publishes the deck to GitHub Pages. Inert while the repository is private:
# Pages does not build private repos on free plans, so this starts working the
# moment the repo is made public on presentation day.
name: Deploy deck to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A talk-day push should replace what is live rather than queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The deck is static, but the island lives in two files and a stale copy
      # breaks navigation silently. Fail here rather than in front of a room.
      - name: Verify the wrapper island matches the composition
        run: |
          npm run sync
          git diff --exit-code index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
