    const pages = {
      'kapak':`<div class="coverLayout"><div class="coverCopy"><div class="kicker" lang="en">Ankara Data Community · ADC #3</div><h1>Agentic Data Engineering</h1><p class="lede">DataOps'ta <span class="accent">kuraldan ajana</span></p></div><div class="coverPortraitWrap"><img class="coverPortrait" src="assets/identity/cc-avatar.jpg" alt="Cemal Cici"><p class="speakerLine">Cemal Cici - Kıdemli Veri Mühendisi</p></div></div>`,
      'her-sey-yesil':`<div class="folio">01</div><div class="kicker">Bir veri ekibinin tanıdık sabahı</div><div class="grid2"><div class="big heroStack green">Her şey<br>yeşil.</div><div class="card" data-reveal data-at="10.6"><h3>Pipeline sağlıklı</h3><p>Dashboard güncel görünüyor. Sorgular cevap veriyor.</p></div></div><p class="lede" data-reveal data-at="11.5">Bu sistem gerçekten sağlıklı mı?</p>`,
      'son-kosu-basarisiz':`<div class="folio">02</div><div class="kicker">Yanlış yeşil</div><h2>Görünen çıktı ile onu üreten sürecin sağlığı aynı şey değildir.</h2><div class="grid2"><div class="card greenBorder"><h3 class="green">Eski veri hâlâ burada</h3><p>Son başarılı mart tablosu sorgulara cevap vermeye devam eder.</p></div><div class="card coralBorder" data-reveal data-at="20.6"><h3 class="red">Son koşu başarısız</h3><p>Yeni veri işlenmedi. Ekran dolu, süreç kırık.</p></div></div><p class="lede" data-reveal data-at="21.5">Sorunu bazen ilk kez bir kullanıcı bildirir.</p>`,
      'sunumun-sorusu':`<div class="kicker">Sunumun sorusu</div><h2>Önceden yazılmış kuralların kapsayamadığı bir değişiklik olduğunda <span class="accent">ne yaparız?</span></h2>`,
      'degisiklik-uretime':`<div class="folio">03</div><div class="kicker">Ortak dil</div><h2>Bir veri değişikliği, üretime tek adımda çıkmaz.</h2><div class="flow"><div class="step"><b>İhtiyaç</b><span>İstenen sonucu tanımlarız.</span></div><div class="step"><b>Geliştirme</b><span>Pipeline ve dönüşümü kurarız.</span></div><div class="step" data-reveal data-at="40.6"><b>Test</b><span>Beklentiyi otomatik sınarız.</span></div><div class="step" data-reveal data-at="41.2"><b>İnceleme</b><span>Bir insan değişikliği okur.</span></div><div class="step" data-reveal data-at="41.8"><b>Yayınlama</b><span>Üretim ortamına taşırız.</span></div></div><p class="source">Pipeline: Veriyi kaynaktan tüketilebilir bir çıktıya taşıyan ve dönüştüren çalışma zinciri.</p>`,
      'dataops-dongusu':`<div class="folio">04</div><div class="kicker" lang="en">DataOps</div><h2>Veride döngü, yayınla bitmez.</h2><div class="flow"><div class="step"><b>Geliştir</b><span>Değişikliği üret.</span></div><div class="step"><b>Çalıştır</b><span>Pipeline'ı işlet.</span></div><div class="step" data-reveal data-at="50.6"><b>Gözlemle</b><span>Koşu ve veri sağlığını oku.</span></div><div class="step" data-reveal data-at="51.3"><b>Araştır ve düzelt</b><span>Kanıtla geri besle.</span></div></div><p class="lede">DataOps, bu sürekli geri besleme döngüsünü güvenilir kılar.</p>`,
      'kurallarla-yonetim':`<div class="folio">05</div><div class="kicker">Bugünkü araç kutusu</div><h2>Kurallar, bilinen riski güvenilir biçimde denetler.</h2><div class="pipe"><div class="node"><strong>Kaynak</strong><small>Veri sözleşmesi</small></div><div class="arrow">→</div><div class="node"><strong>Pipeline</strong><small>Freshness · çalışma durumu</small></div><div class="arrow">→</div><div class="node"><strong>Veri ürünü</strong><small>Test · eşik · alarm</small></div></div><p class="lede" data-reveal data-at="60.6">Testler, eşikler ve runbook'lar ajanın alternatifi değildir.</p><p class="lede" data-reveal data-at="61.3">Onlar, ajanın <span class="accent">doğrulayıcılarıdır.</span></p>`,
      'kuralin-siniri':`<div class="kicker">Kuralın doğal sınırı</div><div class="quote">Kural, önceden ifade edebildiğimiz durumu denetler.</div><p class="lede">Önceden tarif etmediğimiz durumda araştıracak bir katmana ihtiyaç duyarız.</p>`,
      'otomasyondan-ajana':`<div class="folio">06</div><div class="kicker">Sorumluluğun değişimi</div><h2>Fark, daha hızlı yazmak değil; iş akışını kimin yönettiğidir.</h2><div class="grid3"><div class="card" data-reveal data-at="80.6"><h3>Otomasyon</h3><p>Tanımlı adımları tekrarlar.</p></div><div class="card" data-reveal data-at="81.3"><h3>Copilot</h3><p>İnsana içerik ve kod önerir.</p></div><div class="card coralBorder" data-reveal data-at="82"><h3>Ajan</h3><p>Hedefi yorumlar, araç kullanır ve sonucu değerlendirir.</p></div></div>`,
      'ade-tanimi':`<div class="folio">07</div><div class="kicker">Çalışma tanımı</div><h2>Agentic Data Engineering, veri yaşam döngüsündeki görevleri <span class="blue">bağlam</span>, <span class="accent">araç kullanımı</span> ve <span class="green">doğrulama</span> üzerinden yürüten ajanlardan yararlanma yaklaşımıdır.</h2><p class="source">Kavramsal sentez: OpenAI, Anthropic, IBM ve Qlik. Ayrıntılar SOURCES.md dosyasında.</p>`,
      'iki-yon':`<div class="folio">08</div><div class="kicker">Kavramın iki yönü</div><h2>Agentic Data Engineering, hem yöntemi hem de yeni veri tüketicisini değiştirir.</h2><div class="axis"><div class="card" data-reveal data-at="100.6"><h3>Ajanlarla veri mühendisliği</h3><p>Ajanlar pipeline geliştirir, olay araştırır ve kontrollü eylem alır.</p></div><div class="plus">+</div><div class="card" data-reveal data-at="101.4"><h3>Ajanlar için güvenilir veri</h3><p>Ajanlara güncel, anlamlı, kaliteli ve politika kontrollü bağlam sunulur.</p></div></div>`,
      'kapsam-haritasi':`<div class="folio">09</div><div class="kicker">Büyük resim</div><h2>Alanı dört bölgede okuyabiliriz.</h2>${map(null).replaceAll('class="region"','class="region" data-reveal').replace('data-reveal data-n="01"','data-reveal data-at="110.6" data-n="01"').replace('data-reveal data-n="02"','data-reveal data-at="110.6" data-n="02"').replace('data-reveal data-n="03"','data-reveal data-at="111.4" data-n="03"').replace('data-reveal data-n="04"','data-reveal data-at="111.4" data-n="04"')}`,
      'tasarla-gelistir':`<div class="folio">10</div><div class="kicker">Bölge 01</div><h2>Niyet, geliştirilebilir veri ürünlerine çevrilir.</h2>${map(0,'Doğal dilden pipeline, dönüşüm kodu, test ve dokümantasyon üretimi.')}`,
      'islet-iyilestir':`<div class="folio">11</div><div class="kicker">Bölge 02</div><h2>Olaylar, yalnızca alarm değil araştırılabilir görev hâline gelir.</h2>${map(1,'Alarm triyajı, kök neden analizi, optimizasyon ve kontrollü self-healing.')}`,
      'anlamlandir-yonet':`<div class="folio">12</div><div class="kicker">Bölge 03</div><h2>Teknik metadata, iş anlamı ve politika aynı bağlamda buluşur.</h2>${map(2,'Katalog, lineage, veri sözleşmeleri, kalite, erişim ve yönetişim.')}`,
      'ajanlar-icin-veri':`<div class="folio">13</div><div class="kicker">Bölge 04</div><h2>Ajanın kararı, beslendiği verinin güvenilirliği kadar güçlüdür.</h2>${map(3,'Güncel, kaliteli, semantik olarak açıklanmış ve politika kontrollü veri ürünleri.')}`,
      'tek-gorev-degil':`<div class="kicker">Bölüm sentezi</div><h2>Agentic Data Engineering, tek bir ürün veya görev değildir.</h2><p class="lede">Veri yaşam döngüsünde karar ve eylem sorumluluğunun yeniden dağıtılmasıdır.</p>`,
      'model-tek-basina-degil':`<div class="folio">14</div><div class="kicker">Datacının gözünden ajan</div><h2>Model tek başına ajan değildir.</h2><div class="grid2"><div class="card coralBorder"><div class="big">Model</div><p>Hedefi yorumlar ve sonraki adımı seçer.</p></div><div class="grid2" data-reveal data-at="170.6"><div class="card"><h3>Bağlam</h3><p>Dünya hakkında kanıt.</p></div><div class="card"><h3>Araçlar</h3><p>Okuma ve eylem yüzeyi.</p></div><div class="card"><h3>Doğrulayıcı</h3><p>Çıktıyı yanlışlar.</p></div><div class="card"><h3>Yetki</h3><p>Nereye kadar gidebilir?</p></div></div></div><p class="micro" data-reveal data-at="171.3">Model + harness + araçlar + ortam = davranış</p>`,
      'kanit-dongusu':`<div class="folio">15</div><div class="kicker">Yürütme modeli</div><h2>Datacının gözünden ajan, kanıtla beslenen bir karar ve eylem döngüsüdür.</h2><div class="loop"><div class="loopbox">Hedefi yorumla</div><div class="miniarr">→</div><div class="loopbox evidence" data-reveal data-at="180.5">Kanıt topla</div><div class="miniarr">→</div><div class="loopbox action" data-reveal data-at="181">Planla ve eyle</div><div class="miniarr">→</div><div class="loopbox verify" data-reveal data-at="181.5">Doğrula</div></div><p class="lede" data-reveal data-at="182">Sonuca göre uyarla, gerekirse tekrarla ve yetki sınırında dur.</p><p class="source">“Agent loop” yürütme modelidir; Agentic Data Engineering'in tamamının tanımı değildir.</p>`,
      'baglam-kaynaklari':`<div class="folio">16</div><div class="kicker" lang="en">Grounding</div><h2>Ajanın bağlamı, veri platformunun yaşayan kayıtlarından gelir.</h2><div class="grid3"><div class="card blueBorder" data-reveal data-at="190.6"><h3>Canlı durum</h3><p>Şema, çalışma logu ve sorgu sonucu.</p></div><div class="card blueBorder" data-reveal data-at="191.2"><h3>Teknik bağlam</h3><p>Kod, lineage, test ve veri sözleşmesi.</p></div><div class="card blueBorder" data-reveal data-at="191.8"><h3>İş bağlamı</h3><p>Glossary, sahiplik, SLA ve politika.</p></div></div>`,
      'grounding-dogrulama':`<div class="folio">17</div><div class="kicker">Halüsinasyonu doğru çerçevelemek</div><h2>Daha fazla bağlam, tek başına doğruluk garantisi değildir.</h2><div class="grid2"><div class="card blueBorder" data-reveal data-at="200.6"><h3 class="blue">Grounding</h3><p>Modeli canlı kanıta bağlar ve yanlış varsayım riskini azaltır.</p></div><div class="card greenBorder" data-reveal data-at="201.5"><h3 class="green">Doğrulama</h3><p>Yanlış önerinin eyleme dönüşmesini deterministik olarak engeller.</p></div></div>`,
      'dogrulayici-merkezde':`<div class="folio">18</div><div class="kicker">Güvenilirliğin mekanizması</div><h2>Bir ajanın gücü, yazdığı koddan değil; o kodu ucuza yanlışlayabilen doğrulayıcısından gelir.</h2><div class="grid3"><div class="card" data-reveal data-at="210.6"><h3>Öneri</h3><p>Modelin olası çözümü.</p></div><div class="card greenBorder" data-reveal data-at="211.3"><h3>Doğrulayıcı</h3><p>Compile, test, sorgu ve politika.</p></div><div class="card"><h3 class="green">Kanıt</h3><p>İncelenebilir sonuç.</p></div></div>`,
      'yetki-siniri':`<div class="folio">19</div><div class="kicker" lang="en">Human-in-the-loop</div><h2>Ajanın nerede durduğu, ne kadar akıllı olduğundan daha önemlidir.</h2><div class="grid2"><div class="card blueBorder" data-reveal data-at="220.6"><h3>Araştırma alanı</h3><p>Oku, karşılaştır, hipotez kur ve sandbox'ta doğrula.</p></div><div class="card coralBorder" data-reveal data-at="221.3"><h3>Eylem sınırı</h3><p>Yazma, yayınlama ve geri döndürülemeyen işlem için yetki iste.</p></div></div><p class="source">Human-in-the-loop (HITL): İnsan, her adımda değil; riskli karar ve eylem sınırlarında döngüye girer.</p>`,
      'risk-yuzeyleri':`<div class="folio">20</div><div class="kicker">Risk, tek yerde doğmaz</div><h2>Güvenlik modeli yalnızca prompt'a yazılamaz.</h2><div class="flow"><div class="step"><b>Bağlam</b><span>Eksik, eski veya manipüle edilmiş.</span></div><div class="step"><b>Karar</b><span>Yanlış çıkarım veya araç seçimi.</span></div><div class="step" data-reveal data-at="230.6"><b>Eylem</b><span>Aşırı yetki veya yanlış hedef.</span></div><div class="step" data-reveal data-at="231.3"><b>Operasyon</b><span>Sınırsız döngü ve izlenemeyen davranış.</span></div></div>`,
      'guardrail-katmanlari':`<div class="folio">21</div><div class="kicker">Katmanlı savunma</div><h2>Guardrail, bir prompt cümlesi değil; sistem mimarisidir.</h2><div class="layers"><div class="layer" data-reveal data-at="240.5"><b>Kimlik ve erişim</b><span>Hangi veri ve sisteme erişebilir?</span></div><div class="layer" data-reveal data-at="241"><b>Araç ve kapsam</b><span>Hangi fonksiyon, dosya ve hedef kullanılabilir?</span></div><div class="layer" data-reveal data-at="241.5"><b>Sandbox ve doğrulama</b><span>Çıktı gerçek dünyaya dokunmadan nasıl sınanır?</span></div><div class="layer" data-reveal data-at="242"><b>İnsan ve trace</b><span>Hangi eylem onay ister, karar nasıl denetlenir?</span></div></div>`,
      'otonomi-merdiveni':`<div class="folio">22</div><div class="kicker">Kademeli yetki</div><h2>Otonomi bir açma kapama düğmesi değil, kazanılan bir yetkidir.</h2><div class="ladder"><div class="rung"><b>Gözlemle</b><span>Yalnızca oku</span></div><div class="rung" data-reveal data-at="250.5"><b>Açıkla</b><span>Kök neden üret</span></div><div class="rung" data-reveal data-at="251"><b>Öner</b><span>Diff hazırla</span></div><div class="rung" data-reveal data-at="251.5"><b>Sandbox</b><span>İzole uygula</span></div><div class="rung" data-reveal data-at="252"><b>Onaylı eylem</b><span>İnsan kapısı</span></div><div class="rung"><b>Sınırlı otonomi</b><span>Kanıtla genişler</span></div></div>`,
      'ilk-kullanim-alani':`<div class="folio">23</div><div class="kicker">Kendi stack'inizde başlayın</div><h2>İyi bir pilot, dört soruya güçlü cevap verir.</h2><div class="questions"><div class="question">Başarıyı deterministik olarak ölçebilir miyiz?</div><div class="question" data-reveal data-at="260.6">Hata durumunda geri dönebilir miyiz?</div><div class="question" data-reveal data-at="261.2">Ajanın erişimini daraltabilir miyiz?</div><div class="question" data-reveal data-at="261.8">İnsan onayı için doğal bir karar noktası var mı?</div></div>`,
      'demo-haritadaki-yeri':`<div class="folio">24</div><div class="kicker">Canlı demo</div><h2>Şimdi büyük haritanın küçük ama değerli bir parçasını göreceğiz.</h2>${map(1,'Şema değişikliği, kök neden, doğrulanmış düzeltme ve insan onayı.').replace('class="region active"','class="region active" data-reveal data-at="270.6"')}<p class="source" data-reveal data-at="271.4">Demo, Agentic Data Engineering'in tamamını değil; kontrollü self-healing senaryosunu gösterir.</p>`,
      'demo-stack':`<div class="folio">25</div><div class="kicker">İhtiyaç, araç ve neden</div><h2>Stack, her sınırı gözle görülebilir kılmak için seçildi.</h2><div class="table"><div class="cell head">İhtiyaç</div><div class="cell head">Araç</div><div class="cell head">Neden</div><div class="cell">Pipeline ve hata</div><div class="cell">Airflow</div><div class="cell">Gerçek koşu durumu ve log</div><div class="cell">Dönüşüm doğrulaması</div><div class="cell">dbt</div><div class="cell">Öneriyi gerçek projede build etmek</div><div class="cell" data-reveal data-at="280.6">Canlı şema ve incident</div><div class="cell" data-reveal data-at="280.6">PostgreSQL</div><div class="cell" data-reveal data-at="280.6">Ground truth ve kalıcı durum</div><div class="cell" data-reveal data-at="281.3">Ajan, trace ve onay</div><div class="cell" data-reveal data-at="281.3">LangGraph · Phoenix · Streamlit</div><div class="cell" data-reveal data-at="281.3">Açık graf, iz ve insan kapısı</div></div>`,
      'demoda-izleyin':`<div class="folio">26</div><div class="kicker">Üç kanıt</div><h2>Demoda sonucu değil, davranışı izleyin.</h2><div class="watch"><div class="card" data-reveal data-at="290.6"><div class="num">01</div><h3>Kanıt</h3><p>Ajan hangi canlı bilgileri topluyor?</p></div><div class="card" data-reveal data-at="291.2"><div class="num">02</div><h3>Doğrulama</h3><p>Önerisini gerçek araçlarla nasıl sınıyor?</p></div><div class="card" data-reveal data-at="291.8"><div class="num">03</div><h3>Yetki</h3><p>Hangi noktada durup insana dönüyor?</p></div></div>`,
      'ana-mesaj':`<div class="kicker">Aklınızda tek cümle kalsın</div><h2>Ajan, kuralın yerine geçmez. Kuralın kapsayamadığını araştırır, önerisini <span class="accent">kurallarla sınar.</span></h2>`,
      'tesekkur':`<div class="thanksClosing"><div><div class="kicker">Teşekkürler</div><h2>Sorularınızı ve itirazlarınızı duymak isterim.</h2><p class="lede">Sunum, kaynaklar ve çalışan demo açık kaynak olarak paylaşılacak.</p></div><div class="qrs"><div><img class="qr" src="assets/identity/qr-cemal-linkedin.png" alt="Cemal Cici LinkedIn QR kodu"><div class="qrlabel">Konuşmacı · LinkedIn</div></div><div><img class="qr" src="assets/identity/qr-adc-linkedin.png" alt="Ankara Data Community LinkedIn QR kodu"><div class="qrlabel">Ankara Data Community</div></div></div></div><div class="appendixButton">Teknik ekler</div>`,
      'ek-mimari':`<div class="kicker">Teknik ek 01</div><h2>PoC, yazma yetkisini servis sınırlarıyla daraltır.</h2><div class="grid3"><div class="card"><h3>Veri yolu</h3><p>Kaynak PostgreSQL → Airflow extract → dbt staging ve mart.</p></div><div class="card"><h3>Ajan yolu</h3><p>Airflow logu + canlı şema + dbt modeli → teşhis → doğrulanmış öneri.</p></div><div class="card"><h3>Operatör yolu</h3><p>Incident store → Streamlit diff → onay veya ret → Phoenix trace.</p></div></div>`,
      'ek-graf':`<div class="kicker">Teknik ek 02</div><h2>Graf, dört durum dalını açıkça ayırır.</h2>${list(['Diagnosing: Başarısız koşuyu ve kanıtları bulur.','Proposing: Düzeltme üretir, scratch kopyada build eder.','Waiting: Öneri kararı gelene kadar hiçbir eylem almaz.','Acting: Yalnızca approved durumunu okuyunca uygular ve kendi koşusunu doğrular.'])}`,
      'ek-langgraph':`<div class="kicker">Teknik ek 03</div><h2>LangGraph, akışı daha otonom yapmak için değil; sınırları okunabilir kılmak için kullanıldı.</h2><p class="lede">Her düğüm ayrı trace edilir. Incident durumu hangi dalın çalışacağını belirler. İnsan onayı, iki servis arasındaki kalıcı durumdur.</p>`,
      'ek-mcp':`<div class="kicker">Teknik ek 04</div><h2>MCP kullanılmadı; iki araç için doğrudan istemciler daha küçük bir hata yüzeyi sundu.</h2><p class="lede">Airflow REST API'sine ve PostgreSQL'e sıradan Python istemcileriyle erişiliyor. MCP doğal bir genişleme noktasıdır, fakat güven modelini tek başına değiştirmez.</p>`,
      'ek-hafiza-planlama':`<div class="kicker">Teknik ek 05</div><h2>PoC, incident'lar arasında hafıza kullanmaz ve serbest planlama yapmaz.</h2><div class="grid2"><div class="card"><h3>Hafıza yok</h3><p>Her incident canlı şema, kod ve loglardan yeniden teşhis edilir.</p></div><div class="card"><h3>Plan sabit</h3><p>Model adımların sırasını değil, teşhis ve düzeltme içeriğini seçer.</p></div></div>`,
      'ek-yetki':`<div class="kicker">Teknik ek 06</div><h2>Onay kapısı, model davranışından bağımsız olarak uygulanır.</h2>${list(['Approved durumunu yalnızca konsol yazabilir.','Konsolun dbt mount\'u yoktur; ajan yalnızca izinli model dizinine yazabilir.','Konsolun Airflow kullanıcısı read-only\'dir; koşu başlatamaz.','Operatör tam dosya diff\'ini görür ve yalnızca karar sütununu değiştirir.'])}`,
      'ek-dogrulama':`<div class="kicker">Teknik ek 07</div><h2>Derlenmeyen hiçbir öneri operatöre ulaşmaz.</h2><div class="flow"><div class="step"><b>Üret</b><span>Tam dosya içeriği.</span></div><div class="step"><b>Build et</b><span>Scratch dbt projesi.</span></div><div class="step"><b>Hata varsa</b><span>Compiler çıktısını modele geri ver.</span></div><div class="step"><b>En fazla iki retry</b><span>Sonra unfixable olarak kapan.</span></div></div>`,
      'ek-production':`<div class="kicker">Teknik ek 08</div><h2>Production'a geçiş, daha güçlü modelden önce daha güçlü sistem sınırları ister.</h2>${list(['Kimlik, sır yönetimi, tenant ve veri sınıflandırması.','Incident çeşitliliği, eval seti ve regresyon testleri.','Rollback, değişiklik yönetimi ve görev ayrılığı.','Maliyet, gecikme, rate limit ve operasyonel SLO\'lar.'])}`
    };
    for(const host of document.querySelectorAll('[data-body]')) host.innerHTML=pages[host.dataset.body]||'';

    function revealProfile(el){
      if(el.classList.contains('region')){
        const i=[...el.parentElement.children].indexOf(el);
        return {autoAlpha:0,x:i%2===0?-72:72,y:i<2?-42:42,scale:.94,rotation:i%2===0?-1.2:1.2};
      }
      if(el.classList.contains('layer')) return {autoAlpha:0,x:-64,y:0,scale:.98};
      if(el.classList.contains('rung')) return {autoAlpha:0,x:0,y:72,scale:.94};
      if(el.classList.contains('loopbox')) return {autoAlpha:0,x:0,y:0,scale:.82};
      if(el.classList.contains('cell')) return {autoAlpha:0,x:0,y:28,scale:.98};
      if(el.matches('.lede,.source,.micro')) return {autoAlpha:0,x:-42,y:0,scale:1};
      return {autoAlpha:0,x:0,y:38,scale:.94};
    }

    window.__timelines=window.__timelines||{};
    const root=gsap.timeline({paused:true});
    const sceneRecords=[];
    for(const scene of document.querySelectorAll('.scene')){
      const start=Number(scene.dataset.start),end=start+Number(scene.dataset.duration);
      const reveals=[...scene.querySelectorAll('[data-reveal]')];
      const times=[...new Set(reveals.map(el=>Number(el.dataset.at||start+.6)))].sort((a,b)=>a-b);
      const groups=times.map(at=>({at,elements:reveals.filter(el=>Number(el.dataset.at||start+.6)===at),dot:null}));
      if(groups.length){
        const rail=document.createElement('div');rail.className='revealRail';rail.setAttribute('aria-hidden','true');
        groups.forEach((group,index)=>{const dot=document.createElement('span');dot.className='revealDot'+(index===0?' isNext':'');rail.appendChild(dot);group.dot=dot;});
        scene.querySelector('.content').appendChild(rail);
      }
      sceneRecords.push({scene,start,end,groups});
      root.set(scene,{autoAlpha:1,pointerEvents:'auto'},start);
      root.set(scene,{autoAlpha:0,pointerEvents:'none'},end);
      for(const group of groups){
        for(const el of group.elements){
          root.fromTo(el,revealProfile(el),{autoAlpha:1,x:0,y:0,scale:1,rotation:0,duration:.42,ease:'back.out(1.35)'},group.at);
        }
        root.fromTo(group.dot,{scale:.72,backgroundColor:'transparent',borderColor:'#828c9a'},{scale:1,backgroundColor:'#e8940c',borderColor:'#e8940c',duration:.42,ease:'back.out(2)'},group.at);
      }
    }
    // Render a stable cover frame on a fresh browser load. A paused GSAP
    // timeline at exactly t=0 has not yet applied its zero-duration scene sets.
    root.time(5,false);
    // Publish only after the timeline has its final duration. The standalone
    // player probes this registry and may otherwise capture a zero-length root.
    window.__timelines.root=root;

    // Slideshow navigation seeks directly to hold points. Replaying only the
    // crossed reveal group makes each remote click visibly legible while the
    // registered root timeline remains deterministic for snapshots and checks.
    const liveReplays=new Set();let replayRestoring=false;let lastTime=root.time();
    function clearReplays(){
      if(!liveReplays.size)return;
      liveReplays.forEach(tl=>tl.kill());liveReplays.clear();
      const at=root.time();replayRestoring=true;root.render(at,false,true);replayRestoring=false;
    }
    function replayGroup(group){
      const fx=gsap.timeline({onComplete:()=>liveReplays.delete(fx)});liveReplays.add(fx);
      group.elements.forEach((el,index)=>fx.fromTo(el,revealProfile(el),{autoAlpha:1,x:0,y:0,scale:1,rotation:0,duration:.42,ease:'back.out(1.35)',overwrite:false},index*.05));
      fx.fromTo(group.dot,{scale:.72,backgroundColor:'transparent',borderColor:'#e8940c'},{scale:1.35,backgroundColor:'#e8940c',borderColor:'#e8940c',duration:.18,ease:'power2.out',overwrite:false},0)
        .to(group.dot,{scale:1,duration:.24,ease:'back.out(2)',overwrite:false},.18);
    }
    gsap.ticker.add(()=>{
      if(replayRestoring)return;
      const now=root.time();if(Math.abs(now-lastTime)<.001)return;
      if(now<lastTime){clearReplays();lastTime=now;return;}
      for(const record of sceneRecords){for(const group of record.groups){if(group.at>lastTime+.001&&group.at<=now+.001)replayGroup(group);}}
      lastTime=now;
    });
    window.__hfSetReplay=on=>{if(!on)clearReplays();};
  </script>
